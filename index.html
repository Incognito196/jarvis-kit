<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06080c">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Jarvis</title>
<style>
  :root{
    --bg:#06080c; --panel:#0d1219; --line:#1b2431; --ink:#e6edf6; --dim:#7b8a9e;
    --accent:#4fd1c5; --accent-dim:#1f6f69; --warn:#f0a35e; --bad:#e8657a; --good:#5fd08a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#0d1621 0%,var(--bg) 60%);
    color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .name{font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--dim)}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  .badge.on{color:var(--accent);border-color:var(--accent-dim)}
  header .sp{flex:1}

  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0;min-width:0}
  @media (max-width:820px){ main{grid-template-columns:1fr} aside{display:none} .stage{padding:14px} }

  .stage{display:flex;flex-direction:column;min-height:0;min-width:0;padding:18px}
  .orbwrap{display:flex;align-items:center;justify-content:center;padding:8px 0 14px}
  canvas#orb{width:190px;height:190px;max-width:44vh;max-height:44vh}
  .state{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);min-height:16px}
  .state b{color:var(--accent);font-weight:500}

  .log{flex:1;overflow-y:auto;margin:14px 0 0;padding-right:6px;scrollbar-width:thin}
  .turn{margin:0 0 14px}
  .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .turn.me .who{color:#8fa6c2}
  .turn.jarvis .who{color:var(--accent)}
  .msg{white-space:pre-wrap;word-break:break-word}
  .turn.me .msg{color:#c4d3e6}
  .tool{font-family:var(--mono);font-size:11px;color:var(--dim);opacity:.8}

  .composer{display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
  input#text{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:11px 13px;font:inherit;outline:none}
  input#text:focus{border-color:var(--accent-dim)}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;
    padding:11px 15px;font:inherit;cursor:pointer;transition:border-color .15s,color .15s}
  button:hover{border-color:var(--accent-dim);color:var(--accent)}
  button.live{border-color:var(--accent);color:var(--accent)}

  aside{border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 24px;scrollbar-width:thin}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px}
  .card h3{margin:0 0 9px;font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
  .row .k{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v{font-family:var(--mono);font-size:12px;text-align:right}
  .bar{height:4px;border-radius:2px;background:#152030;margin:4px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
  .bar.hot i{background:var(--warn)} .bar.crit i{background:var(--bad)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:7px;vertical-align:1px}
  .dot.up{background:var(--good)}
  .empty{color:var(--dim);font-size:12px;line-height:1.5}
  .empty code{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .err{color:var(--bad);font-size:12px;font-family:var(--mono)}
  #flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a1013;
    border:1px solid var(--bad);color:#ffc9d2;padding:8px 14px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .3s;max-width:80vw}
</style>
</head>
<body>
<header>
  <span class="name" id="brandName">Jarvis</span>
  <span class="badge" id="bModel">—</span>
  <span class="badge" id="bVoice">—</span>
  <span class="sp"></span>
  <span class="badge" id="bMic">mic off</span>
</header>

<main>
  <section class="stage">
    <div class="orbwrap"><canvas id="orb" width="380" height="380"></canvas></div>
    <div class="state" id="state">standby</div>
    <div class="log" id="log"></div>
    <div class="composer">
      <input id="text" placeholder="Type, or hold the mic button…" autocomplete="off" autocapitalize="sentences">
      <button id="send">Send</button>
      <button id="mic" title="Toggle hands-free listening">Mic</button>
    </div>
  </section>

  <aside id="panels"></aside>
</main>

<div id="flash"></div>

<script>
"use strict";
const TOKEN = "__JARVIS_TOKEN__";
const AUTH = TOKEN ? {"X-Jarvis-Token": TOKEN} : {};
const $ = s => document.querySelector(s);

/* ---------- small helpers ---------- */
function flash(msg){ const e=$("#flash"); e.textContent=msg; e.style.opacity=1; clearTimeout(flash.t);
  flash.t=setTimeout(()=>e.style.opacity=0, 4000); }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ---------- transcript ---------- */
const log = $("#log");
function addTurn(who, text){
  const d = document.createElement("div");
  d.className = "turn " + (who === "you" ? "me" : "jarvis");
  d.innerHTML = `<div class="who">${esc(who)}</div><div class="msg"></div>`;
  d.querySelector(".msg").textContent = text || "";
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d.querySelector(".msg");
}
function addTool(name){
  const d = document.createElement("div");
  d.className = "tool"; d.textContent = "· " + name;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

/* ---------- state + orb ---------- */
let state = "standby";              // standby | listening | thinking | speaking
let level = 0;                      // 0..1 audio level, drives the orb
function setState(s){
  state = s;
  $("#state").innerHTML = s === "standby" ? "standby" : `<b>${s}</b>`;
}
const cv = $("#orb"), cx = cv.getContext("2d");
function sizeOrb(){
  const dpr = Math.min(devicePixelRatio || 1, 2), s = cv.clientWidth;
  cv.width = s*dpr; cv.height = s*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", sizeOrb); sizeOrb();

function drawOrb(ts){
  const s = cv.clientWidth, c = s/2, t = ts/1000;
  cx.clearRect(0,0,s,s);
  const colour = { standby:[79,209,197,.35], listening:[95,208,138,.85],
                   thinking:[240,163,94,.8], speaking:[79,209,197,.95] }[state];
  const [r,g,b,a] = colour;
  const base = s*0.26, pulse = state==="thinking" ? Math.sin(t*3)*0.04 : 0;
  const rad = base * (1 + pulse + level*0.22);

  // soft core
  const grad = cx.createRadialGradient(c,c,rad*0.15,c,c,rad*1.5);
  grad.addColorStop(0, `rgba(${r},${g},${b},${a*0.5})`);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  cx.fillStyle = grad; cx.beginPath(); cx.arc(c,c,rad*1.5,0,7); cx.fill();

  // three rings, each wobbling on its own phase
  for(let i=0;i<3;i++){
    const rr = rad * (1 + i*0.16);
    cx.beginPath();
    for(let k=0;k<=96;k++){
      const ang = k/96 * Math.PI*2;
      const wob = Math.sin(ang*(3+i) + t*(1.1+i*0.5)) * (2.5 + level*10) * (state==="standby"?0.4:1);
      const rp = rr + wob;
      const x = c + Math.cos(ang)*rp, y = c + Math.sin(ang)*rp;
      k ? cx.lineTo(x,y) : cx.moveTo(x,y);
    }
    cx.closePath();
    cx.strokeStyle = `rgba(${r},${g},${b},${a*(0.5 - i*0.13)})`;
    cx.lineWidth = i ? 1 : 1.6; cx.stroke();
  }
  requestAnimationFrame(drawOrb);
}
requestAnimationFrame(drawOrb);

/* ---------- audio out + barge-in ---------- */
let actx = null, analyser = null, current = null, speaking = false;
async function ensureCtx(){
  if(!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 512;
  }
  if(actx.state === "suspended") await actx.resume();
  return actx;
}
document.addEventListener("pointerdown", () => { ensureCtx().catch(()=>{}); }, {once:false});

function readLevel(){
  if(!analyser){ level = Math.max(0, level - 0.03); return; }
  const buf = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(buf);
  let sum = 0; for(const v of buf) sum += v;
  const now = Math.min(1, (sum / buf.length) / 90);
  level = level*0.7 + now*0.3;                 // smooth, or the orb strobes
}
setInterval(readLevel, 60);

function stopSpeech(){
  if(current){ try{ current.pause(); }catch(e){} current = null; }
  queue.length = 0; speaking = false;
  if(state === "speaking") setState(listening ? "listening" : "standby");
}

/* ---------- speech in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, heard = "", idleTimer = null;
const WAKE = new RegExp("\\b(" + (localStorage.getItem("wake") || "jarvis") + ")\\b", "i");

function setMicBadge(){
  $("#bMic").textContent = listening ? "listening" : "mic off";
  $("#bMic").classList.toggle("on", listening);
  $("#mic").classList.toggle("live", listening);
}

function startMic(){
  if(!SR){ flash("This browser has no speech recognition — type instead."); return; }
  if(rec) return;
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || "en-US";
  rec.onresult = ev => {
    let interim = "", final = "";
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      r.isFinal ? final += r[0].transcript : interim += r[0].transcript;
    }
    if(speaking && (interim + final).trim().length > 3) stopSpeech();   // barge-in
    if(final){
      heard += " " + final;
      clearTimeout(idleTimer);
      idleTimer = setTimeout(flushHeard, 900);   // a short pause means "your turn"
    }
  };
  rec.onerror = ev => { if(ev.error === "not-allowed") { flash("Microphone blocked."); stopMic(); } };
  rec.onend = () => { if(listening){ try{ rec.start(); }catch(e){} } };   // iOS suspends it
  try{ rec.start(); }catch(e){}
  listening = true; setMicBadge();
  if(state === "standby") setState("listening");
}
function stopMic(){
  listening = false; setMicBadge();
  if(rec){ try{ rec.onend = null; rec.stop(); }catch(e){} rec = null; }
  if(state === "listening") setState("standby");
}
function flushHeard(){
  let t = heard.trim(); heard = "";
  if(!t) return;
  // Address it to Jarvis by name, or set a blank wake word to react to everything.
  if(WAKE.source !== "\\b()\\b" && !WAKE.test(t) && t.length < 24) return;
  t = t.replace(WAKE, "").replace(/^[\s,.:;!\-]+/, "").trim();
  if(t) send(t);
}
$("#mic").addEventListener("click", async () => {
  await ensureCtx().catch(()=>{});
  listening ? stopMic() : startMic();
});

/* ---------- speaking the reply ---------- */
const queue = [];
async function playNext(){
  if(speaking || !queue.length) return;
  const chunk = queue.shift();
  speaking = true; setState("speaking");
  let b64 = "";
  try{
    const r = await fetch("/speak", {method:"POST",
      headers:{"Content-Type":"application/json", ...AUTH},
      body: JSON.stringify({text: chunk})});
    if(r.ok) b64 = (await r.json()).audio_b64 || "";
  }catch(e){}
  if(!b64){                                  // bridge voice unavailable — use the browser's
    speaking = false;
    if("speechSynthesis" in window){
      const u = new SpeechSynthesisUtterance(chunk);
      u.onend = () => { speaking = false; playNext(); };
      speaking = true; speechSynthesis.speak(u); return;
    }
    return playNext();
  }
  await ensureCtx().catch(()=>{});
  const audio = new Audio("data:audio/mp3;base64," + b64);
  current = audio;
  try{
    const src = actx.createMediaElementSource(audio);
    src.connect(analyser); analyser.connect(actx.destination);
  }catch(e){ /* already wired, or no ctx — play bare */ }
  audio.onended = audio.onerror = () => { speaking = false; current = null; playNext(); };
  try{ await audio.play(); }
  catch(e){ speaking = false; flash("Tap anywhere once to let audio play."); }
}
function enqueue(text){
  const clean = text.trim();
  if(clean){ queue.push(clean); playNext(); }
}

/* Break a growing stream into sentences, so the voice starts before the reply ends. */
function makeSentencer(){
  let buf = "";
  return {
    push(t){
      buf += t;
      let m;
      while((m = buf.match(/^([\s\S]{12,}?[.!?…])(\s|$)/))){
        enqueue(m[1]); buf = buf.slice(m[0].length);
      }
    },
    flush(){ if(buf.trim()) enqueue(buf); buf = ""; }
  };
}

/* ---------- one turn ---------- */
let busy = false;
async function send(text){
  if(busy){ flash("Still working on the last one."); return; }
  busy = true; stopSpeech();
  addTurn("you", text);
  setState("thinking");
  const out = addTurn("jarvis", "");
  const say = makeSentencer();
  let got = "";
  try{
    const r = await fetch("/think_stream", {method:"POST",
      headers:{"Content-Type":"application/json", ...AUTH},
      body: JSON.stringify({text, channel:"web"})});
    if(r.status === 401){ throw new Error("This viewer isn't trusted, so the page has no action token."); }
    if(!r.ok || !r.body) throw new Error("bridge said " + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let pending = "";
    for(;;){
      const {value, done} = await reader.read();
      if(done) break;
      pending += dec.decode(value, {stream:true});
      const lines = pending.split("\n"); pending = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        let ev; try{ ev = JSON.parse(line); }catch(e){ continue; }
        if(ev.type === "model"){ $("#bModel").textContent = shortModel(ev.model); }
        else if(ev.type === "delta"){ got += ev.text; out.textContent = got; say.push(ev.text);
          log.scrollTop = log.scrollHeight; }
        else if(ev.type === "tool"){ addTool(ev.name); }
        else if(ev.type === "done"){ if(ev.reply && ev.reply !== got){ out.textContent = ev.reply; } }
        else if(ev.type === "error"){ out.textContent = ev.message; flash(ev.message); }
      }
    }
    say.flush();
  }catch(e){
    out.textContent = "(" + e.message + ")";
    flash(e.message);
  }finally{
    busy = false;
    if(!speaking) setState(listening ? "listening" : "standby");
    loadHealth();
  }
}
function shortModel(m){
  if(!m) return "—";
  return m.replace(/^claude-/, "").replace(/-\d{8}$/, "");   // drop the vendor prefix and date stamp
}
$("#send").addEventListener("click", () => { const t = $("#text").value.trim(); if(t){ $("#text").value=""; send(t); }});
$("#text").addEventListener("keydown", e => { if(e.key === "Enter"){ $("#send").click(); }});

/* ---------- agent panels (generic renderer) ---------- */
function bar(frac){
  const pct = Math.round(Math.max(0, Math.min(1, frac)) * 100);
  const cls = pct > 90 ? "bar crit" : pct > 75 ? "bar hot" : "bar";
  return `<div class="${cls}"><i style="width:${pct}%"></i></div>`;
}
function row(k, v){ return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`; }
function label(k){ return k.replace(/_(gb|sec|ms|frac)$/,"").replace(/_/g," "); }

/* Renders any shape an agent returns, without knowing what the agent is:
   - {frac: 0..1}          -> a meter
   - [{name, up}]          -> a status dot list
   - nested objects        -> indented rows
   - scalars               -> label/value rows                                      */
function renderValue(key, val){
  if(val === null || val === undefined || val === "") return "";
  if(Array.isArray(val)){
    if(!val.length) return `<div class="empty">no ${esc(label(key))} yet</div>`;
    if(val.every(v => v && typeof v === "object" && "up" in v)){
      return val.map(v => `<div class="row"><span class="k"><i class="dot${v.up?" up":""}"></i>${esc(v.name||v.host||"?")}</span>`
        + `<span class="v">${v.up ? "up" : "down"}</span></div>`).join("");
    }
    return val.map((v,i) => typeof v === "object" ? renderValue(String(i), v) : row(label(key), v)).join("");
  }
  if(typeof val === "object"){
    let html = "";
    if(typeof val.frac === "number"){
      const used = val.used_gb!=null ? `${val.used_gb}/${val.total_gb} GB`
                 : val.free_gb!=null ? `${val.free_gb} GB free` : Math.round(val.frac*100)+"%";
      html += row(label(key), used) + bar(val.frac);
      return html;
    }
    for(const [k,v] of Object.entries(val)) html += renderValue(k, v);
    return html;
  }
  if(key.endsWith("_frac")){                      // a bare fraction reads as a meter, not 0.654
    return row(label(key), Math.round(Number(val)*100) + "%") + bar(Number(val));
  }
  if(key.endsWith("_sec")){
    const s = Number(val);
    return row(label(key), s >= 3600 ? `${(s/3600)|0}h ${((s%3600)/60)|0}m` : `${(s/60)|0}m`);
  }
  if(key === "raw" || key === "error") return `<div class="${key==="error"?"err":"empty"}">${esc(val)}</div>`;
  return row(label(key), val);
}

async function loadPanels(){
  let panels = {};
  try{
    const r = await fetch("/agents/panels");
    panels = (await r.json()).panels || {};
  }catch(e){ return; }
  const host = $("#panels");
  const names = Object.keys(panels).sort();
  if(!names.length){
    host.innerHTML = `<div class="card"><h3>No agents</h3><div class="empty">
      Nothing is installed yet. Scaffold one with <code>./jarvisctl new myagent</code>,
      or switch on a shipped one: <code>./jarvisctl enable nodes</code>.</div></div>`;
    return;
  }
  host.innerHTML = names.map(n => {
    const p = panels[n];
    const body = Object.entries(p.data || {}).map(([k,v]) => renderValue(k,v)).join("")
              || `<div class="empty">nothing reported</div>`;
    return `<div class="card"><h3>${esc(p.title || n)}</h3>${body}</div>`;
  }).join("");
}

async function loadHealth(){
  try{
    const h = await (await fetch("/health")).json();
    if(h.name){ $("#brandName").textContent = h.name; document.title = h.name; }
    $("#bVoice").textContent = h.voice || "—";
    if(h.model) $("#bModel").textContent = shortModel(h.model);
    $("#bModel").classList.toggle("on", !!h.session);
    if(h.last_error && h.last_error_age_sec < 120) flash(h.last_error);
  }catch(e){}
}

loadHealth(); loadPanels();
setInterval(loadPanels, 10000);
setInterval(loadHealth, 15000);
if(!TOKEN){
  flash("No action token on this page — the bridge doesn't recognise this viewer.");
}
</script>
</body>
</html>
